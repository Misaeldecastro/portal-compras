name: Deploy para Firebase (prj-prd-infra-01)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Os secrets e variables da config do Firebase vivem neste environment.
    # Sem esta linha o job não os enxerga e o build sai com valores vazios.
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Instalar dependências das functions
        run: npm ci --prefix functions

      - name: Autenticar no Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRJ_PRD_INFRA_01 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # prj-prd-infra-01 é compartilhado com intranet-oliv-e e vitals-olive-prd.
      # Os alvos são estreitos de propósito:
      #   hosting:portal  → só o site portal-compras, nunca o site default
      #   functions:api   → só a nossa função, sem risco de apagar as de outros
      #   firestore       → só o banco nomeado declarado no firebase.json
      - name: Deploy (hosting + functions + rules e índices)
        run: >
          npx --yes firebase-tools@15.5.1 deploy
          --only hosting:portal,functions:api,firestore
          --project prj-prd-infra-01
          --non-interactive

      - name: Remover credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
